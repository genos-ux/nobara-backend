[project]
name = "nabora-crm"
version = "0.1.0"
description = "Nabora CRM API — modular FastAPI backend for nutritionist/fitness practice management."
authors = [
    { name = "genos-ux", email = "mrhihihi59@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14.0",
    "bcrypt<5",
    "email-validator>=2.0",
    "fastapi>=0.162.0",
    "greenlet>=3.5.6",
    "itsdangerous>=2.2.0",
    "psycopg2-binary>=2.9.13",
    "psycopg[binary]>=3.3.8",
    "pydantic[email]>=2.0",
    "pydantic-settings>=2.16.2",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.33",
    "sqladmin>=0.32.0",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
    "cloudinary>=1.47.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.28",
]

[project.scripts]
nabora-crm = "nabora_crm:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
