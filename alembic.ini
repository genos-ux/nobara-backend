# Alembic configuration for Nabora CRM
# The actual database URL is injected at runtime from environment variables
# via migrations/env.py (using core.config.settings), so the sqlalchemy.url
# here is a placeholder and never used in practice.

[alembic]
script_location = migrations
prepend_sys_path = src
# Placeholder — overridden by migrations/env.py
sqlalchemy.url = postgresql+psycopg://placeholder

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
